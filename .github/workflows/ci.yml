# PR 과 main 에서 타입 · 린트 · 테스트 · 포맷 · 빌드를 검사한다.
# pre-commit 은 스테이징된 파일만 빠르게 보고, 전체 검사(특히 import/no-cycle)는 여기서 한다.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # husky 는 로컬 git 훅 설치용이다. CI 에서는 필요 없다
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4

      # packageManager(pnpm@11.1.0)를 그대로 쓴다
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: 타입
        run: pnpm tsc --noEmit

      - name: 린트
        run: pnpm lint

      - name: 테스트 (DB 함수 · RLS 는 PGlite 로)
        run: pnpm test

      - name: 포맷
        run: pnpm format:check

      # 비밀값 없이 빌드한다. Supabase 클라이언트는 브라우저에서만 만들어 env 없이도 빌드된다
      - name: 빌드
        run: pnpm build
