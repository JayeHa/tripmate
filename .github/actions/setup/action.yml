# CI 작업마다 같은 준비 — pnpm · Node · 의존성 설치. 체크아웃은 각 작업이 먼저 한다(이 파일을 읽으려면 필요)
name: setup
description: pnpm · Node 24 · 의존성 설치
runs:
  using: composite
  steps:
    # packageManager(pnpm@11.1.0)를 그대로 쓴다. 서드파티 action 이라 태그 대신 커밋 SHA 로 고정한다
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

    - uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: pnpm

    - run: pnpm install --frozen-lockfile
      shell: bash
